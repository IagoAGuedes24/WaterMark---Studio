<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <!-- Simbolo Estilizado de Cruz / Foco Fotografico -->
    <circle cx="70" cy="70" r="46" fill="none" stroke="url(#logoGrad)" stroke-width="4.5"/>
    <path d="M70 38 V102 M46 58 H94" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="10" fill="url(#logoGrad)"/>
    <circle cx="70" cy="70" r="26" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Tipografia -->
    <text x="135" y="68" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="url(#logoGrad)" letter-spacing="4">CRISMA</text>
    <text x="137" y="96" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="url(#logoGrad)" letter-spacing="7">PASTORAL DA COMUNICAÇÃO</text>
  </g>
</svg>